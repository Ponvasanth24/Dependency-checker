<table *ngIf="pagedCpeData.length > 0" [ngClass]="{'table-dark': darkMode, 'table-white': !darkMode}"
class="table border border-2 border-secondary table-responsive-lg table-borderless table-striped mt-2">
<caption [ngClass]="{'table-dark': darkMode, 'table-white': !darkMode}" class="caption-side-top custom-fw-1">Total CPE Results: <span class="h5 text-warning">{{cpeData.length}}</span></caption>
    <thead>
        <tr>
            <th>CPE Name</th> 
        </tr>
    </thead>
     <tbody>
        <tr *ngFor="let data of pagedCpeData">
            <td><a (click)="searchCpeName(data.cpe23Uri)" [ngClass]="{'text-white': darkMode, 'text-dark': !darkMode}" class="text-white cursor-pointer">{{data.cpe23Uri}}</a></td>
        </tr>
     </tbody>
</table>

<!---------------------------------pagination-start----------------------------------------------->
<div *ngIf="pagedCpeData.length > 0;" class="row justify-content-center height-fit-content">
<div class="col-lg-5 d-flex justify-content-evenly align-items-center height-fit-content">
  <mat-label class="text-nowrap" [ngClass]="{'bg-dark': darkMode, 'bg-alice': !darkMode, 'border-white': darkMode, 'border-dark': darkMode,'text-white': darkMode, 'text-dark': !darkMode}">Page Size</mat-label>
  <mat-select class="border rounded page-size-width p-2" [ngClass]="{'text-white': darkMode, 'text-dark': !darkMode}" (selectionChange)="onPageSizeChange($event)" [(ngModel)]="pageSize">
    <mat-option [ngClass]="{'bg-dark':darkMode, 'bg-white':!darkMode, 'text-white':darkMode, 'text-dark': !darkMode}" *ngFor="let size of pageSizes" [value]="size">
      {{ size }}
    </mat-option>
  </mat-select>
<span [ngClass]="{'text-white': darkMode, 'text-dark': !darkMode}" class="text-white">{{start}} - {{end}} out of {{cpeData.length}} cpe's</span>

<button (click)="previousPage()" [ngClass]="{'bg-white': darkMode, 'custom-app-grey': !darkMode}" class="page-custom-btn btn d-flex justify-content-center align-items-center outline-0 border-0 rounded-circle shadow-sm"> 
<mat-icon class="material-symbols-outlined">
arrow_back_ios
</mat-icon>  
</button>
<button (click)="nextPage()" [ngClass]="{'bg-white': darkMode, 'custom-app-grey': !darkMode}" class="page-custom-btn btn d-flex justify-content-center align-items-center outline-0 border-0 rounded-circle shadow-sm">
<mat-icon class="material-symbols-outlined">
arrow_forward_ios
</mat-icon>
</button>
</div>
</div>
<!---------------------------------pagination-end------------------------------------------------>
<!--------------------------------No-vulnerability-data-start------------------------------------->
<div #noCpeData *ngIf="pagedCpeData.length === 0" [ngClass]="{'bg-dark': darkMode, 'bg-white': !darkMode}" class="d-flex justify-content-center align-items-center mt-2">
  <div class="text-center">
    <span [ngClass]="{'text-white': darkMode, 'text-dark': !darkMode}" class="h3">No CPE Data Found</span>
  </div>
</div>
<!--------------------------------No-vulnerability-data-end--------------------------------------->
<div class="position-fixed h-100 d-flex justify-content-center align-items-center" *ngIf="isLoading"
    [ngClass]="{'bg-dark': darkMode, 'bg-white': !darkMode}">
    <div id="progress-bar" class="loader" style="--n: 16; --f: 0.2">
    </div>
</div>
