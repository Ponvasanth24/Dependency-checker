<div class="bg-danger d-flex justify-content-between">
        <h5 class="modal-title text-white p-1 ps-2">Enter Your Port Number</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="p-3">
         <div class="w-75">
           <label class="form-label fnw-bold text-primary" for="customFile">Upload pom.xml file (Optional)</label>
           <input type="file" class="form-control" id="customFile" />
         </div>
        <div class="d-flex justify-content-between mt-4">
           <input type="number" class="w-75 form-control" [(ngModel)]="portNumber">
           <button class="btn btn-danger" [disabled]="portNumber.toString().length < 4" (click)="startScan()" data-bs-dismiss="modal">Scan</button>
         </div>
</div>
